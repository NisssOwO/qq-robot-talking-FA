<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ 聊天机器人控制台</title>
<style>
:root {
  --bg: #12151c;
  --surface: #1a1f29;
  --surface-sunken: #151a23;
  --border: #2a3242;
  --text: #e6ebf3;
  --muted: #8d99ac;
  --accent: #6f8bff;
  --accent-soft: #202a44;
  --ok: #47b57d;
  --ok-soft: #16281f;
  --warn: #e0993f;
  --warn-soft: #2a2114;
  --err: #e26a6a;
  --err-soft: #2c1a1a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
:root
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
  display: flex; overflow: hidden;
}


/* ── 左导航 ── */
aside { width: 236px; flex: 0 0 236px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh; }
.brand { padding: 18px 18px 14px; font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 9px; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(150deg, var(--accent), #7c93ff);
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.nav { padding: 4px 10px 10px; overflow-y: auto; flex: 1; }
.nav-group { padding: 12px 8px 6px; font-size: 11px; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px;
  cursor: pointer; font-size: 13.5px; user-select: none; position: relative; }
.nav-item:hover { background: var(--surface-sunken); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.nav-item.dim { color: var(--muted); opacity: .55; cursor: default; }
.nav-item.dim:hover { background: transparent; }
.side-foot { border-top: 1px solid var(--border); padding: 10px; }

/* ── 主区 ── */
main { flex: 1 1 auto; min-width: 0; height: 100vh; overflow-y: auto; }
.view { display: block; }
.view[hidden] { display: none !important; }
.view.on { display: block; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
.eyebrow { font-size: 11px; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
h1 { margin: 4px 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -.2px; }
.sub { color: var(--muted); font-size: 13px; max-width: 560px; margin: 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.card-title { font-weight: 640; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.count { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-sunken);
  border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px; }
.card-head .spacer { flex: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grid > .span2 { grid-column: span 2; }
.ver-row { display: grid; grid-template-columns: 108px 132px minmax(0, 1fr) auto; gap: 12px 16px;
  align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.ver-row:last-child { border-bottom: none; }
.ver-k { color: var(--muted); font-size: 13px; }
.ver-n { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.ver-b { display: flex; align-items: center; }
.ver-a { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.sess-list { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
.sess-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-size: 13px; }
.sess-item:hover { border-color: var(--accent); }
.sess-item.on { border-color: var(--accent); background: rgba(88,140,255,.10); }
.sess-item .sid { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
.sess-item .meta { margin-left: auto; opacity: .65; font-size: 12px; white-space: nowrap; }
.msg-row { display: grid; grid-template-columns: 22px 34px 72px 62px minmax(0,1fr); gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; align-items: start; cursor: default; }
.msg-row:hover { background: rgba(255,255,255,.03); }
.msg-row .idx { opacity: .45; }
.msg-row .role { font-weight: 600; }
.msg-row .len { opacity: .65; }
.msg-row .txt { white-space: pre-wrap; word-break: break-word; opacity: .8; }
.stk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px; padding: 16px; }
.stk-item { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.stk-item img { width: 100%; height: 132px; object-fit: contain; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
.stk-note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; word-break: break-word; }
.stk-badge { font-size: 11px; color: var(--muted); opacity: .8; }
@media (max-width: 720px) {
  .ver-row { grid-template-columns: 108px 1fr; }
  .ver-a { justify-content: flex-start; }
}
@media (max-width: 960px) {
  .grid { grid-template-columns: 1fr; }
  .grid > .span2 { grid-column: auto; }
}

/* ── 状态灯 ── */
.led { width: 8px; height: 8px; border-radius: 50%; background: #b8bfcc; flex: 0 0 8px;
  display: inline-block; transition: background .2s, box-shadow .2s; }
.led.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(47, 158, 99, .16); }
.led.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(217, 131, 36, .16); }
.led.err { background: var(--err); box-shadow: 0 0 0 3px rgba(214, 69, 69, .16); }

/* 状态长条 */
.live, .live-top { display: flex; align-items: center; gap: 16px; padding: 16px 18px; flex-wrap: wrap; }
.live .led, .live-top .led { width: 13px; height: 13px; flex: 0 0 13px; }
.live-state { font-size: 21px; font-weight: 650; letter-spacing: .01em; line-height: 1.25; }
.live-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.live-facts { margin-left: auto; display: flex; gap: 26px; text-align: right; flex-wrap: wrap; }
.live-facts div span { display: block; font-size: 11.5px; color: var(--muted); }
.live-facts div strong { font-size: 13.5px; font-weight: 620; }

/* 要点列表 */
.tips { padding: 6px 16px 14px; }
.tip { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.tip:last-child { border-bottom: 0; }
.tip b { flex: 0 0 96px; font-weight: 620; font-size: 12.5px; color: var(--text); }
.tip span { color: var(--muted); }

/* 一排绿灯 */
.conn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); background: transparent; }
.conn-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-sunken); }
.conn-item:last-child { border-right: 0; }
.conn-name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conn-sub { display: flex; align-items: baseline; gap: 1px; }
.conn-port { font: 11.5px "Cascadia Mono", Consolas, monospace; color: var(--muted); }
.conn-state { font-family: inherit; font-size: 11.5px; font-weight: 650; }
.conn-state.ok { color: var(--ok); }
.gw-val { font-size: 13.5px; padding: 8px 0; }
.conn-state.warn { color: var(--warn); }
.conn-state.ond { color: var(--muted); }

/* 进程行 */
.proc-row { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 14px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border); }
.proc-row:hover { background: var(--surface-sunken); }
.proc-row > .led { width: 9px; height: 9px; flex: 0 0 9px; }
.proc-main { min-width: 0; }
.proc-name { font-weight: 620; font-size: 13.5px; }
.proc-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proc-side { display: flex; gap: 20px; }
.proc-kv span { display: block; font-size: 11px; color: var(--muted); }
.proc-kv strong { font-size: 12.5px; font-weight: 600; }
.btns { display: flex; gap: 6px; }

/* 侧栏底部 */
.side-foot .nav-item { width: 100%; border: 0; background: transparent; color: var(--muted); }
.side-foot .nav-item:hover { background: var(--surface-sunken); color: var(--text); }
.foot-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px 2px; font-size: 12px; color: var(--muted); }
.foot-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 7px; }
.foot-row .dot.ok { background: var(--ok); }
.foot-row .dot.err { background: var(--bad); }
.foot-sub { padding: 0 10px 4px; font-size: 11px; color: var(--muted); opacity: .8; }

/* 表单 */
.field { padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field .hint { font-size: 11.5px; color: var(--muted); opacity: .88; line-height: 1.55; }
.field input { width: 100%; }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; }
.formgrid .field { padding-bottom: 6px; }
input[type=time] { font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; width: 104px; }
input[type=time]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* 开关行 */
.opt { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.opt:last-child { border-bottom: 0; }
.opt > div { flex: 1; min-width: 0; }
.opt-name { font-size: 13.5px; font-weight: 600; }
.opt-sub { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 2px; }
/* 单选行 */
.choice { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid var(--border); cursor: pointer; }
.choice:hover { background: var(--surface-sunken); }
.choice input { width: auto; flex: 0 0 auto; margin: 2px 0 0; accent-color: var(--accent); }
.choice-txt { display: block; }
.choice-txt b { font-size: 13.5px; font-weight: 600; display: block; }
/* 周几 */
.wdays { display: flex; gap: 6px; padding: 12px 16px 4px; }
.wd { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); display: grid;
  place-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.wd.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
/* 时段行 */
.tm-row { display: flex; gap: 8px; align-items: center; padding: 5px 16px; }
.tm-sep { font-size: 12px; color: var(--muted); }
/* 角色包列表 */
.rl-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
  border-bottom: 1px solid var(--border); cursor: pointer; }
.rl-item:hover { background: var(--surface-sunken); }
.rl-item.active { background: var(--accent-soft); }
.rl-item .ric { width: 16px; height: 16px; stroke: var(--muted); fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 16px; }
.rl-name { flex: 1; font-size: 13.5px; font-weight: 560; }
.rl-num { font-size: 11.5px; color: var(--muted); }
/* 嵌入控制台的占位框 */
.embed { padding: 42px 24px 48px; text-align: center; background: var(--surface-sunken); }
.embed-title { font-size: 15px; font-weight: 620; }
.embed-sub { font-size: 12.5px; color: var(--muted); line-height: 1.8; margin-top: 8px; }
.embed-tags { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.etag { font-size: 11.5px; color: var(--muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }

/* 按钮 */
.btn { font-family: inherit; font-size: 13px; font-weight: 550; border-radius: 8px; padding: 6px 13px;
  cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-sunken); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.mini { padding: 4px 10px; font-size: 12.5px; }
.btn.danger { color: var(--err); }
.btn.danger:hover { background: var(--err-soft); }
.btn.mini.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* 日志 */
.logbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.logbar .search { margin-left: auto; width: 200px; }
.lvchips { display: flex; gap: 5px; margin-left: 6px; }
.lvchips .chip-filter { padding: 2px 9px; font-size: 12px; }
.log { font: 12.5px/1.7 "Cascadia Mono", Consolas, monospace; padding: 12px 16px; max-height: 320px;
  overflow-y: auto; background: var(--surface-sunken); }
.log div { white-space: pre-wrap; word-break: break-all; }
.log .t { color: var(--muted); }
.log .info { color: var(--text); }
.log .ok { color: var(--ok); }
.log .warn { color: var(--warn); }
.log .err { color: var(--err); }

/* 提示条 */
.note { display: flex; gap: 9px; align-items: flex-start; padding: 10px 16px; background: var(--surface-sunken);
  border-top: 1px solid var(--border); color: var(--muted); font-size: 12.5px; }
.note b { color: var(--text); font-weight: 600; }
.note svg { width: 15px; height: 15px; flex: 0 0 15px; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ── 对话范围 ── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 16px; background: transparent; }
.stat { background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.stat-label { font-size: 11.5px; color: var(--muted); }
.stat-value { font-size: 19px; font-weight: 650; margin-top: 2px; letter-spacing: -.3px; }
.stat-value small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 5px; }
.add-row { display: flex; gap: 8px; padding: 12px 16px; background: var(--surface-sunken);
  border-bottom: 1px solid var(--border); align-items: center; }
.add-row input { flex: 1 1 auto; min-width: 0; }
.add-row input.remark { flex: 0 0 180px; }
.filters { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.chip-filter { border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
.chip-filter.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.filters .search { margin-left: auto; width: 190px; }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 24px 1fr 190px 104px auto; gap: 12px; align-items: center;
  padding: 11px 16px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-sunken); }
.row.off .num, .row.off .remark-text { color: var(--muted); }
.row-index { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.num { font-family: "Cascadia Mono", Consolas, "SF Mono", monospace; font-size: 13.5px; font-weight: 550;
  letter-spacing: .2px; }
.remark-text { color: var(--muted); font-size: 13px; }
.remark-text.empty { opacity: .45; font-style: italic; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 2px 9px; border-radius: 999px; width: fit-content; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.on { color: var(--ok); background: var(--ok-soft); }
.badge.off { color: var(--muted); background: var(--surface-sunken); }
.badge.warn { color: var(--warn); background: var(--warn-soft); }
a.link { color: var(--accent-text, #7fb4ff); text-decoration: none; }
a.link:hover { text-decoration: underline; }
.switch { width: 38px; height: 21px; border-radius: 999px; background: var(--border); position: relative;
  cursor: pointer; transition: background .16s; flex: 0 0 auto; border: 0; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22); transition: transform .16s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(17px); }
/* 开关里如果塞了真 checkbox（label>input 写法），把它藏起来只当点击区，
   视觉仍由 .switch 本体和 ::after 圆点负责——否则原生方框会露出来叠在圆点上。 */
.switch input[type="checkbox"] { position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; opacity: 0; cursor: pointer; }
.switch:has(input:checked) { background: var(--ok); }
.switch:has(input:checked)::after { transform: translateX(17px); }
.row-actions { display: flex; gap: 5px; justify-content: flex-end; align-items: center; }
input[type=text], input[type=search] { font-family: inherit; font-size: 13.5px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px;
  outline: none; transition: border-color .14s, box-shadow .14s; }
input[type=text]:focus, input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input::placeholder { color: var(--muted); opacity: .7; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.empty-title { font-weight: 600; color: var(--text); margin-bottom: 3px; font-size: 13.5px; }
.empty-icon { font-size: 20px; opacity: .45; margin-bottom: 8px; }

/* 保存条 */
.savebar { position: fixed; left: 236px; right: 0; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--border); padding: 11px 26px; display: flex; align-items: center;
  gap: 12px; box-shadow: 0 -4px 18px rgba(20,28,45,.05); z-index: 50; }
.savebar .dirty { font-size: 12.5px; color: var(--warn); font-weight: 600; }
.savebar .spacer { flex: 1; }

/* 弹窗 */
.mask { position: fixed; inset: 0; background: rgba(15,20,32,.38); display: none; place-items: center; z-index: 9999; }
.mask.show { display: grid; }
.dialog { width: 400px; background: var(--surface); border-radius: 14px; padding: 20px;
  border: 1px solid var(--border); box-shadow: 0 24px 60px rgba(10,16,28,.3); }
.dialog h3 { margin: 0 0 8px; font-size: 15.5px; }
.dialog p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.dialog code { font: 13px "Cascadia Mono", Consolas, monospace; background: var(--surface-sunken);
  padding: 1px 6px; border-radius: 5px; color: var(--text); }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.btn.danger-solid { background: var(--err); border-color: transparent; color: #fff; }
.btn.danger-solid:disabled { opacity: .45; cursor: not-allowed; }
.import-list { margin-top: 12px; max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
.import-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.import-row:last-child { border-bottom: 0; }
.import-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); flex: 0 0 auto; margin: 0; }
.import-row .spacer { flex: 1; }
.import-row.done { opacity: .5; }
.import-tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }

.toast-host { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex;
  flex-direction: column; gap: 8px; z-index: 10000; align-items: center; }
.toast { background: var(--text); color: var(--surface); padding: 8px 15px; border-radius: 9px;
  font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(10,16,28,.25); animation: pop .18s ease-out; }
.toast.err { background: var(--err); color: #fff; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
.hidden { display: none !important; }

/* ══ 项目适配层（设计稿没有、但项目页面需要的部分）══ */
:root {
  --surface-subtle: var(--surface-sunken);
  --surface-hover: var(--surface-sunken);
  --card-border: var(--border);
  --text-strong: var(--text);
  --text-secondary: var(--muted);
  --muted-soft: var(--muted);
  --placeholder: var(--muted);
  --bad: var(--err);
  --accent-hover: var(--accent);
  --accent-soft-bg: var(--accent-soft);
  --accent-soft-fg: var(--accent);
  --accent-border-soft: var(--accent-soft);
  --mono: "Cascadia Mono", Consolas, "Noto Sans Mono", monospace;
}
html, body { height: 100%; margin: 0; }
/* body 布局见上方 flex 定义 */
aside { width: 236px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
aside::-webkit-scrollbar { width: 0; }
#nav { padding: 4px 10px 10px; overflow-y: auto; flex: 1; }
.nav-item .ico { width: 16px; text-align: center; color: var(--muted); font-size: 12px; flex: 0 0 16px; }
.nav-item.active .ico { color: var(--accent); }
.aside-foot .dot.ok { background: var(--ok); }
.aside-foot .dot.warn { background: var(--warn); }
.aside-foot .dot.bad { background: var(--err); }
.theme-row button { width: 100%; display: flex; align-items: center; gap: 6px; justify-content: center;
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--muted); font: 12px/1 inherit; cursor: pointer; }
.theme-row button:hover { background: var(--surface-sunken); color: var(--text); }
main { overflow-y: auto; min-width: 0; }
.view[hidden] { display: none; }
.view.pad { padding: 22px 26px 40px; }

/* 嵌入页：撑满内容区，不留底部空白 */
.view.embed { padding: 0; height: 100vh; overflow: hidden; }
.view.embed > .card { height: 100vh; margin: 0; border: 0; border-radius: 0; box-shadow: none; overflow: hidden; }
.view.embed > .card > iframe { width: 100%; height: 100vh; border: 0; display: block; }
.view > iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
.view.pad > .card > iframe { border-radius: 0 0 12px 12px; }

/* ── 基础控件：项目里大量按钮/输入框没有 class，靠元素选择器 ── */
button { cursor: pointer; font: inherit; font-size: 13px; font-weight: 550; border-radius: 8px;
  padding: 6px 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  white-space: nowrap; transition: background .14s, border-color .14s, color .14s; }
button:hover:not(:disabled) { background: var(--surface-sunken); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
button.danger { color: var(--err); }
button.danger:hover:not(:disabled) { background: var(--err-soft); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.mini { padding: 4px 10px; font-size: 12.5px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 13px 0 6px; }
label:first-of-type { margin-top: 0; }
input, textarea, select { width: 100%; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font: inherit; font-size: 13.5px; outline: none;
  transition: border-color .14s, box-shadow .14s; }
input:focus, textarea:focus, select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 66px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 11.5px; color: var(--muted); opacity: .88; margin-top: 5px; line-height: 1.55; }
.hint code { font-family: var(--mono); font-size: 11px; }
.steps { margin: 12px 0 0; padding-left: 17px; color: var(--muted); font-size: 12px; }
.steps li { margin: 2px 0; }
pre { margin: 0; padding: 12px 16px; background: var(--surface-sunken); border: 1px solid var(--border);
  border-radius: 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; max-height: 250px;
  overflow: auto; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 3px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none; line-height: 1.7; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { border-color: transparent; color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.field input[type="checkbox"], .field input[type="radio"], .choice input[type="checkbox"], .choice input[type="radio"] { width: auto; flex: 0 0 auto; margin: 2px 0 0; accent-color: var(--accent); }
.field-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px 14px; }
.field-actions .hint { margin: 0; }

/* ── 状态长条（项目用 .live-card/.live-top//* 一排指示灯：设计稿 .conn / .conn-item，项目沿用 .conn-row / .conn */
.conn-name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conn-port { font: 11.5px var(--mono); color: var(--muted); }
.conn-state { font-size: 11.5px; font-weight: 650; }
.conn-state.ok { color: var(--ok); }
.conn-state.warn { color: var(--warn); }
.conn-state.ond { color: var(--muted); }
.proc-kv { display: flex; flex-direction: column; gap: 2px; }
.proc-row:last-of-type { border-bottom: 0; }
.card-head h2, .card-head .card-title { margin: 0; }
.card h2 { margin: 0; font-size: 14.5px; font-weight: 640; letter-spacing: 0; text-transform: none; color: var(--text); }
/* ── 日志 ── */

/* ── 概览统计（设计稿 .stats/.stat）── */
.metric { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); }
.metric > div { padding: 13px 16px; background: var(--surface); border: 0; border-radius: 0; }
.metric span { display: block; font-size: 11.5px; color: var(--muted); }
.metric strong { font-size: 19px; font-weight: 650; letter-spacing: -.3px; }
.metric small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
/* ── 确认弹窗（项目 #confirm-mask 结构，视觉对齐 .mask/.dialog）── */
#confirm-mask { position: fixed; inset: 0; background: rgba(15,20,32,.38); display: grid; place-items: center; z-index: 9999; }
#confirm-mask[hidden] { display: none; }
.confirm-box { width: 400px; max-width: calc(100vw - 48px); background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px; box-shadow: 0 24px 60px rgba(10,16,28,.3); }
.confirm-title { font-size: 15.5px; font-weight: 640; margin-bottom: 8px; }
.confirm-body { color: var(--muted); font-size: 13px; line-height: 1.7; }
.confirm-body code { font-family: var(--mono); font-size: 12px; background: var(--surface-sunken); padding: 1px 6px; border-radius: 5px; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.confirm-actions button { min-width: 84px; }
.rl-list { display: flex; flex-direction: column; }
.rl-item:last-child { border-bottom: 0; }
.field input, .field select, .field textarea { width: 100%; }
.choice:last-child { border-bottom: 0; }

/* nav-item 是 <button>，抹掉按钮默认外观，回到设计稿的导航项长相 */
button.nav-item { width: 100%; border: 0; background: transparent; padding: 8px 10px; text-align: left;
  font: inherit; font-size: 13.5px; font-weight: inherit; color: inherit; border-radius: 8px; }
button.nav-item:hover:not(:disabled) { background: var(--surface-sunken); }
button.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
button.nav-item.active:hover:not(:disabled) { background: var(--accent-soft); }
button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
button.ghost:hover:not(:disabled) { background: var(--surface-sunken); color: var(--text); }
.view.empty-state { padding: 64px 26px; text-align: center; color: var(--muted); font-size: 13px; }

/* 对话范围：备注无边框输入 */
.row input.remark-text { border: 0; background: transparent; padding: 2px 4px; width: 100%;
  font-size: 13px; color: var(--text); border-radius: 6px; }
.row input.remark-text::placeholder { color: var(--muted); opacity: .55; font-style: italic; }
.row input.remark-text:hover { background: var(--surface); }
.row input.remark-text:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px var(--accent-soft-bg); }
.row .btn.mini.danger svg { width: 13px; height: 13px; }
.row .switch { cursor: pointer; border: 0; padding: 0; }
.remark-text.empty { opacity: .45; font-style: italic; }
</style>
</head>
<body>

<aside>
  <div class="brand"><span class="brand-mark">Q</span> QQ 聊天机器人</div>
  <div id="nav" class="nav"></div>
  <div class="side-foot">
    
    <div class="foot-row"><i class="dot" id="foot-dot"></i><span id="foot-text">检查中…</span></div>
    <div class="foot-sub" id="foot-sub">本地运行 · 不经过第三方</div>
  </div>
</aside>

<main id="main"></main>

<!-- 破坏性操作的统一确认层：角色包删除、以及控制台里所有「删除/清空/重置」按钮都走这里 -->
<div id="confirm-mask" hidden>
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title">确认操作</div>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="btn">取消</button>
      <button class="danger" id="confirm-ok">确认删除</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const NAV = [
  { group: '运行', items: [
    { id: 'start',   label: '快速开始', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8z"/></svg>' },
    { id: 'status',  label: '启动与状态', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M4 13h4l2 5h4l2-5h4"/><path d="M12 3v10"/></svg>' },
    { id: 'sessions', label: '会话与审批', svg: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>' }
  ]},
  { group: '角色与行为', items: [
    { id: 'persona',  label: '人格与角色', svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3.1-5.6 7-5.6s7 2.1 7 5.6"/></svg>' },
    { id: 'rolepack', label: '角色包', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>' },
    { id: 'quiet',    label: '静默时间', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 108.9 11.4 8.5 8.5 0 011.6-.9z"/></svg>' },
    { id: 'personalize', label: '个性', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></svg>' },
    { id: 'chat', label: '聊天行为', svg: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.7A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>', self: true },
      { id: 'qzone', label: 'QQ空间', svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 13h8M8 9h5"/></svg>', self: true },
    { id: 'social-v2', label: '二代仿真', svg: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3.5 19c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"/><path d="M16 14.4c2.4 0 4.5 1.3 4.5 3.6"/></svg>' },
    { id: 'social-v1', label: '一代仿真', svg: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="14" rx="2"/><path d="M8 20h8M9 9h6M9 13h4"/></svg>' },
    { id: 'slang',    label: '黑话词库', svg: '<svg viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3 15h16"/></svg>' }
  ]},
  { group: '管理', items: [
    { id: 'model',    label: '模型与密钥', self: true, svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>' },
    { id: 'allow',    label: '对话范围', self: true, svg: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3.5 19c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"/><path d="M16 14.4c2.4 0 4.5 1.3 4.5 3.6"/></svg>' },
    { id: 'qq',       label: 'QQ 启动', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>' },
    { id: 'official', label: '官方通道', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v5M9.6 10.6L12 13l2.4-2.4"/></svg>' },
    { id: 'close',    label: '关窗行为', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M12 4v8"/><path d="M7.5 7a7 7 0 109 0"/></svg>' },
    { id: 'usage',    label: '令牌用量', svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 10h4a1.8 1.8 0 010 3.6h-3"/></svg>' , self: true },
    { id: 'access',   label: '访问与安全', svg: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>' },
    { id: 'operations', label: '调试与运维', svg: '<svg viewBox="0 0 24 24"><path d="M15 4a4.5 4.5 0 00-4 6.7L4 17.6 6.4 20l6.9-7a4.5 4.5 0 005.7-6.2l-2.6 2.6-2.4-2.4z"/></svg>' },
    { id: 'sessionhist', label: '会话历史', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>' },
    { id: 'stickers',  label: '表情包', self: true, svg: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M9 15c1.2 1 3.6 1 4.8 0"/></svg>' },
    { id: 'update',     label: '版本与更新', self: true, svg: '<svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>' },
    { id: 'reference',  label: '工具参考', svg: '<svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M17 7h2v13h-2M8 8h6M8 12h6"/></svg>' }
  ]}
];

let botRunning = false;
let active = 'status';
let frame = null;      // 只有一个 iframe，复用
let framePage = '';    // iframe 里当前所在的 console 页面

// ── 导航 ────────────────────────────────────────────────
for (const g of NAV) {
  const t = document.createElement('div');
  t.className = 'nav-group';
  t.textContent = g.group;
  $('nav').appendChild(t);
  for (const it of g.items) {
    const b = document.createElement('button');
    b.className = 'nav-item';
    b.dataset.nav = it.id;
    b.innerHTML = `${it.svg || ''}<span>${it.label}</span>`;
    b.onclick = () => go(it.id);
    $('nav').appendChild(b);
  }
}

function head(eyebrow, title, desc) {
  return `<div class="head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${desc}</p></div></div>`;
}

// ── 自建页：官方通道（腾讯 QQ 开放平台）─────────────────────
// 这一页要解决的事：原来装插件、填 AppID/Secret、起 dsh 进程全在命令行做，
// 用户得改 yaml、设环境变量、开终端。现在全在这一个页面里完成。
const officialView = document.createElement('section');
officialView.className = 'view pad';
officialView.dataset.view = 'official';
officialView.hidden = true;
$('main').appendChild(officialView);

let officialState = null;
let officialPoll = null;

async function loadOfficial() {
  officialView.innerHTML = head('QQ 通道', '官方通道', '走腾讯 QQ 开放平台的机器人身份，由腾讯侧负责登录态与合规；OneBot 通道走你自己的 QQ 号。两条通道二选一。');
  const shell = document.createElement('div');
  shell.className = 'card';
  shell.style.margin = '0 16px 16px';
  shell.innerHTML = '<div class="card-head"><div class="card-title">正在读取状态…</div></div>';
  officialView.appendChild(shell);
  await refreshOfficial();
}

async function refreshOfficial() {
  let st;
  try {
    st = await (await fetch('/panel/api/official/status', { cache: 'no-store' })).json();
  } catch (e) {
    officialView.querySelector('.card').innerHTML = `<div class="card-head"><div class="card-title">读不到状态</div></div><pre>${esc(e.message)}</pre>`;
    return;
  }
  officialState = st;
  renderOfficial(st);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderOfficial(st) {
  const card = officialView.querySelector('.card');
  if (!card) return;
  const isOfficial = st.channel === 'official';
  const dot = st.running ? 'var(--ok, #3fb950)' : 'var(--muted)';

  const problems = [];
  if (!st.cliExists) problems.push(`找不到 dsh：<code>${esc(st.cliPath)}</code>`);
  if (!st.installed) problems.push('插件还没装');
  if (!st.appId) problems.push('AppID 还没填');
  if (!st.hasSecret) problems.push('AppSecret 还没填');

  card.innerHTML = `
    <div class="card-head">
      <div class="card-title">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dot}"></span>
        官方通道
      </div>
      <div class="spacer"></div>
      <button class="btn mini" id="of-refresh">刷新</button>
    </div>

    <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;margin-bottom:10px;color:var(--muted)">当前使用哪条通道（切换后在「启动与状态」里重启机器人生效）</div>
      <div style="display:flex;gap:10px">
        <button class="btn ${isOfficial ? '' : 'primary'}" data-chan="onebot">OneBot（自己的 QQ 号）</button>
        <button class="btn ${isOfficial ? 'primary' : ''}" data-chan="official">官方通道（腾讯机器人）</button>
      </div>
      ${isOfficial ? '<div style="margin-top:10px;font-size:12px;color:var(--muted)">已切到官方通道：机器人启动时不再拉起 SnowLuma，桥接只提供面板与控制台。</div>' : ''}
    </div>

    <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;margin-bottom:8px">一、安装插件
        <span style="color:var(--muted);font-weight:400">${st.installed ? `已安装 ${esc(st.version)}` : '未安装'}</span>
      </div>
      <button class="btn" id="of-install">${st.installed ? '重新安装 / 升级' : '安装到 qqbot profile'}</button>
      <div class="hint" style="margin-top:8px;font-size:11.5px;color:var(--muted)">
        装到 <code>${esc(st.profileDir)}</code>，和桌面版那个 dsh 分开，互不影响。
      </div>
    </div>

    <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;margin-bottom:8px">二、填资料（在 QQ 开放平台「开发设置」里拿）</div>
      <div class="field" style="padding:0 0 8px">
        <label>AppID</label>
        <input id="of-appid" placeholder="纯数字，例如 102xxxxxx" value="${esc(st.appId)}">
      </div>
      <div class="field" style="padding:0 0 10px">
        <label>AppSecret</label>
        <input id="of-secret" type="password" placeholder="${st.hasSecret ? '已保存，留空表示不修改' : '粘贴 AppSecret'}">
      </div>

function startOfficialPoll() {
  if (officialPoll) return;
  // 只在“官方通道”页可见时轮询：dsh 子进程的输出要实时看到，但不需要一直拉。
  officialPoll = setInterval(() => {
    if (active !== 'official' || !officialState?.running) return;
    void (async () => {
      try {
        const st = await (await fetch('/panel/api/official/status', { cache: 'no-store' })).json();
        const box = officialView.querySelector('#of-log');
        if (box) box.innerHTML = st.output.length ? st.output.map((l) => `<div>${esc(l)}</div>`).join('') : '<div style="opacity:.6">（还没有输出）</div>';
        if (box) box.scrollTop = box.scrollHeight;
      } catch { /* 轮询失败不打断界面 */ }
    })();
  }, 2500);
}

async function officialAction(btn, url, busyText) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyText;
  try {
    const r = await (await fetch(url, { method: 'POST' })).json();
    if (!r.ok && r.error) alert(r.error);
  } catch (e) {
    alert(e.message);
  } finally {
    btn.textContent = old;
    btn.disabled = false;
    await refreshOfficial();
  }
}

async function saveOfficialCreds() {
  const appId = officialView.querySelector('#of-appid').value.trim();
  const appSecret = officialView.querySelector('#of-secret').value.trim();
  if (!appId) { alert('AppID 不能为空'); return; }
  const btn = officialView.querySelector('#of-save');
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    const r = await (await fetch('/panel/api/official/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ appId, appSecret })
    })).json();
    if (!r.ok) alert(r.error || '保存失败');
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
    await refreshOfficial();
  }
}

async function switchChannel(channel) {
  const label = channel === 'official' ? '官方通道' : 'OneBot';
  if (!confirm(`切换到${label}？\n\n切换后需要重启机器人（在「启动与状态」里），否则不生效。`)) return;
  try {
    await fetch('/panel/api/channel', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ channel })
    });
  } catch (e) {
    alert(e.message);
  }
  await refreshOfficial();
}

// 把角色卡推给官方通道进程（走面板自己的 /panel/api/official/role）。
// 传空串 = 用 state/current-role.json 里当前那个角色。
async function pushOfficialRole(role) {
  try {
    const res = await fetch('/panel/api/official/role', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ role: String(role || '') })
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

// 角色列表复用控制台已有的 /api/roles，切角色也走同一个接口，
// 这样两条通道共用一份 roles/ 与 state/current-role.json，不用各存一份。
async function loadOfficialRoles() {
  const box = officialView.querySelector('#of-roles');
  if (!box) return;
  try {
    const r = await (await fetch('/api/roles', { cache: 'no-store' })).json();
    const names = Array.isArray(r.roles) ? r.roles : (Array.isArray(r) ? r : []);
    const list = names.map((n) => (typeof n === 'string' ? n : n.name)).filter(Boolean);
    const cur = String(r.current ?? r.currentRole ?? '');
    if (!list.length) { box.textContent = 'roles/ 目录里还没有角色卡。'; return; }
    box.innerHTML = `<div class="field" style="padding:0"><label>当前角色</label>
      <select id="of-rolesel">${list.map((n) => `<option value="${esc(n)}" ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
      <button class="btn primary" id="of-rolesave" style="margin-top:10px">切换</button>
      <button class="btn" id="of-rolepush" style="margin-top:10px;margin-left:8px">重新推送角色卡</button>
      <div class="hint" style="margin-top:8px">面板主人专用；群友那边只能看到结果，没有切换入口。切换会把角色卡正文推给官方插件（它当作 system prompt 用），下一条消息就生效，不用重启通道。</div>`;
    // 切换 = 写 state/current-role.json（两条通道共用）+ 立刻推给官方插件。
    box.querySelector('#of-rolesave').onclick = async () => {
      const role = box.querySelector('#of-rolesel').value;
      try {
        const res = await (await fetch('/api/role', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ role })
        })).json();
        if (res.ok === false) { alert(res.error || '切换失败'); return; }
        const pushed = await pushOfficialRole(role);
        if (pushed.ok) alert(`已切到「${role}」，已同步到官方通道（${pushed.chars} 字），下一条消息生效。`);
        else if (pushed.code === 'not-running') alert(`已切到「${role}」。官方通道没在跑，启动时会自动推送角色卡。`);
        else alert(`已切到「${role}」，但同步到官方通道失败：${pushed.error}`);
      } catch (e) { alert(e.message); }
    };
    box.querySelector('#of-rolepush').onclick = async () => {
      try {
        const pushed = await pushOfficialRole('');
        if (pushed.ok) alert(`已推送角色卡「${pushed.role}」（${pushed.chars} 字）。`);
        else alert(pushed.error || '推送失败');
      } catch (e) { alert(e.message); }
    };
  } catch (e) {
    box.textContent = `读不到角色列表：${e.message}`;
  }
}

const sessSel = new Set();
let sessState = { list: [], current: null };

async function loadSessions() {
  const box = $('sess-list');
  if (!box) return;
  try {
    const r = await api('sessions');
    sessState.list = Array.isArray(r.sessions) ? r.sessions : [];
    $('sess-count').textContent = String(sessState.list.length);
    box.innerHTML = sessState.list.map((s) => `
      <div class="sess-item${sessState.current === s.id ? ' on' : ''}" data-sid="${s.id}">
        <span class="sid">${escVer(s.id)}</span>
        ${s.blocked ? '<span class="badge off">已暂停</span>' : ''}
        <span class="meta">${s.messages} 条 · ${s.chars.toLocaleString()} 字 · 摘要 ${s.summaryChars}</span>
      </div>`).join('') || '<div class="hint" style="padding:12px">没有会话。</div>';
    box.querySelectorAll('[data-sid]').forEach((el) => {
      el.onclick = () => void openSession(el.dataset.sid);
    });
  } catch (e) {
    box.innerHTML = '<div class="hint" style="padding:12px">读取失败：' + escVer(e.message) + '</div>';
  }
}

async function openSession(id, full = true) {
  sessState.current = id;
  sessState.full = !!full;
  sessSel.clear();
  $('sess-title').textContent = id;
  const box = $('sess-msgs');
  box.innerHTML = '<div class="hint" style="padding:16px">读取中…</div>';
  try {
    const r = await api('session?id=' + encodeURIComponent(id) + (full ? '&full=1' : ''));
    const blockedBar = r.blocked
      ? `<div style="margin:10px 12px;padding:10px 12px;border:1px solid var(--warn);border-radius:9px;background:rgba(230,160,60,.10);font-size:13px;line-height:1.7">
           <b>这个会话被暂停了</b>（${escVer(r.blockedAt)}）。模型那边最近一次请求被内容审核拦下，之后不会再发请求。<br>
           原因：${escVer(r.blockedError)}<br>
           处理：删掉上面几条可疑消息（勾选 → 删除勾选的），再点下面的「解除暂停」，机器人会重新开始回应。
           <div class="field-actions" style="margin-top:8px"><button class="btn" id="sess-unblock">解除暂停</button></div>
         </div>`
      : '';
    box.innerHTML = blockedBar + r.messages.map((m) => `
      <label class="msg-row">
        <input type="checkbox" data-i="${m.index}">
        <span class="idx">${m.index}</span>
        <span class="role">${escVer(m.role)}</span>
        <span class="len">${m.chars} 字</span>
        <span class="txt">${escVer(full && m.content ? m.content : m.preview)}</span>
      </label>`).join('') || '<div class="hint" style="padding:16px">这个会话是空的。</div>';
    box.querySelectorAll('input[data-i]').forEach((cb) => {
      cb.onchange = () => {
        const i = Number(cb.dataset.i);
        if (cb.checked) sessSel.add(i); else sessSel.delete(i);
      };
    });
    if ($('sess-unblock')) $('sess-unblock').onclick = () => void editSession({ mode: 'unblock' });
    if ($('sess-full')) $('sess-full').textContent = full ? '收起全文' : '展开全文';
    await loadSessions();
  } catch (e) {
    box.innerHTML = '<div class="hint" style="padding:16px">读取失败：' + escVer(e.message) + '</div>';
  }
}

async function editSession(body) {
  if (!sessState.current) { toast('先选一个会话', true); return; }
  const note = $('sess-note');
  note.textContent = '正在写入…';
  try {
    const r = await api('session', { method: 'POST', body: JSON.stringify({ id: sessState.current, ...body }) });
    note.textContent = '已保存：' + r.before + ' → ' + r.after + ' 条，摘要 ' + r.summaryChars + ' 字；备份 ' + r.backup + (r.restarted ? '；机器人已重启' : '') + '。';
    await openSession(sessState.current);
  } catch (e) {
    note.textContent = '失败：' + e.message;
    toast('保存失败：' + e.message, true);
  }
}

// ── 运行总览 ─────────────────────────────────────────────
// 链路 + 机器人状态 + 今日计数 + 实时日志。数据全部来自桥接，
// 面板只负责画，免得两边判定标准越走越远。
function ovSetLed(id, ok, warn) {
  const e = $(id);
  if (e) e.className = 'led' + (ok ? ' ok' : warn ? ' warn' : '');
}
function ovSetSt(id, ok, warn) {
  const e = $(id);
  if (!e) return;
  e.textContent = ok ? '在线' : warn ? '启动中' : '离线';
  e.className = 'conn-state' + (ok ? ' ok' : warn ? ' warn' : '');
}
const OV_REASON = {
  atMention: '被 @', nameMention: '叫名字', question: '被提问', poke: '拍一拍',
  proactiveCheck: '主动搭话', replyCheck: '等回复', admin: '手动', probability: '随机醒', anyMessage: '新消息'
};
let ovRole = '';
async function loadOverview() {
  // 链路 + 今日主动搭话
  try {
    const s = await api('status');
    const gw = s.gateway || s.snowluma || {}, bot = s.bot || {}, cfg = s.config || {};
    const botUp = !!(bot.running);
    ovSetLed('ov-led-5099', !!gw.webui, !!gw.running);
    ovSetSt('ov-st-5099', !!gw.webui, !!gw.running && !gw.webui);
    ovSetLed('ov-led-38000', !!gw.onebotHttp, !!gw.running);
    ovSetSt('ov-st-38000', !!gw.onebotHttp, !!gw.running && !gw.onebotHttp);
    ovSetLed('ov-led-38001', !!gw.onebotWs, !!gw.running);
    ovSetSt('ov-st-38001', !!gw.onebotWs, !!gw.running && !gw.onebotWs);
    ovSetLed('ov-led-3101', botUp, false);
    ovSetSt('ov-st-3101', botUp, false);
    if ($('ov-console-sub')) $('ov-console-sub').textContent = '127.0.0.1:' + (cfg.consolePort || 3100);
    try {
      const bk = await consoleFetch('/api/status');
      if (bk && bk.role) ovRole = String(bk.role);
    } catch { /* 昵称拿不到就算了 */ }
    const t = cfg.today || {};
    if ($('ov-proactive')) {
      $('ov-proactive').innerHTML = (t.proactiveMax ? (t.proactive + ' <small>/ ' + t.proactiveMax + '</small>') : String(t.proactive ?? 0));
    }
    if ($('ov-turns')) $('ov-turns').textContent = String(t.spoken ?? 0);
    if ($('ov-convs')) $('ov-convs').textContent = String(t.conversations ?? 0);
  } catch { /* 面板连不上桥接时保持 '—' */ }

  // 机器人状态 + 日志
  try {
    const d = await api('live');
    const list = Array.isArray(d.conversations) ? d.conversations : [];
    const main = list[0] || {};
    const quiet = d.quiet || {};
    const busy = (d.busyKeys || []).length > 0;
    let label = '待命', sub = '在等消息。', led = 'ok';
    if (d.paused) { label = '已暂停'; sub = '控制台里暂停了收发。'; led = ''; }
    else if (busy) { label = '思考中'; sub = '正在读消息、组织回复。'; led = 'ok'; }
    else if (quiet.state && quiet.state !== 'normal') { label = '静默中'; sub = (quiet.reason || '') + '；到点自动恢复。'; led = 'warn'; }
    else if (list.some((c) => c.observing)) { label = '观察中'; sub = '刚说完，等对方接话。'; led = 'ok'; }
    else if (list.some((c) => c.pendingWake)) { label = '准备唤醒'; sub = '马上要开口。'; led = 'ok'; }
    else if (list.some((c) => c.sleeping)) { label = '潜水中'; sub = '已进入潜水，有人叫它就会醒。'; led = 'ok'; }
    else if (list.length) { label = '待唤醒'; sub = '在潜水，还没到点。'; led = ''; }
    else { label = '待命'; sub = '还没开始跑。'; led = ''; }
    if ($('ov-state')) $('ov-state').textContent = label;
    if ($('ov-state-sub')) {
      const gid = String(main.key || '').startsWith('group:') ? String(main.key).slice(6) : '';
      $('ov-state-sub').textContent = (ovRole ? ovRole + (gid ? ' · 群 ' + gid : '') : sub);
    }
    ovSetLed('ov-state-led', led === 'ok', led === 'warn');
    if ($('ov-wake')) $('ov-wake').textContent = main.lastWakeReason ? (OV_REASON[main.lastWakeReason] || main.lastWakeReason) : '—';
    if ($('ov-wake') && main.lastIncomingAt) $('ov-wake').innerHTML = (main.lastWakeReason ? (OV_REASON[main.lastWakeReason] || main.lastWakeReason) : '—') + ' <small>· ' + fmtAgo(main.lastIncomingAt) + '</small>';
    if ($('ov-talk')) $('ov-talk').textContent = main.lastAiReplyAt ? fmtAgo(main.lastAiReplyAt) : '还没说过';
    if ($('ov-unread')) $('ov-unread').textContent = list.reduce((n, c) => n + (Number(c.unread) || 0), 0) + ' 条';
    if ($('ov-convs')) $('ov-convs').textContent = String(list.length);
    if ($('ov-quiet')) {
      $('ov-quiet').textContent = (quiet.state && quiet.state !== 'normal')
        ? ('静默中 · ' + (quiet.until ? fmtClock(quiet.until) + ' 结束' : '到点恢复'))
        : '不在';
    }
  } catch { /* 忽略 */ }

  // 今日用量
  try {
    const r = await consoleFetch('/api/tokens/summary');
    if (r && r.ok) {
      const tot = r.totals || {};
      if ($('ov-cost')) $('ov-cost').textContent = tkNum(tot.totalTokens ?? 0);
    }
  } catch { /* 忽略 */ }

  // 实时日志
  try {
    const r = await api('logs?which=bridge&tail=60');
    const box = $('ov-log');
    if (box) {
      const lines = Array.isArray(r.lines) ? r.lines : [];
      if (!lines.length) box.innerHTML = '<div class="info" style="color:var(--muted)">（还没有日志）</div>';
      else box.innerHTML = lines.map((l) => '<div class="' + logLevelOf(l) + '">' + scopeEsc(l) + '</div>').join('');
      box.scrollTop = box.scrollHeight;
    }
    if ($('ov-log-at')) $('ov-log-at').textContent = fmtClock(Date.now());
  } catch { /* 忽略 */ }
}

function qzFmtTime(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function qzFmtAgo(ms) {
  if (!ms) return '还没发过';
  const diff = Date.now() - ms;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.round(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.round(diff / 3600000) + ' 小时前';
  return Math.round(diff / 86400000) + ' 天前';
}

function qzFill(st) {
  const c = st.conf || {};
  const enabled = c.enabled === true;
  if ($('qz-enabled')) $('qz-enabled').checked = enabled;
  if ($('qz-max')) $('qz-max').value = c.maxPerDay ?? 2;
  if ($('qz-skip')) $('qz-skip').value = Math.round((c.skipChance ?? 0.3) * 100);
  // 发布时刻现在由时间窗口决定（早/午/晚/夜），不再有「间隔」输入框；旧值仍留在配置里兜底。
  const modes = Array.isArray(c.contentModes) && c.contentModes.length ? c.contentModes : ['daily'];
  if ($('qz-mode-daily')) $('qz-mode-daily').checked = modes.includes('daily');
  if ($('qz-mode-topic')) $('qz-mode-topic').checked = modes.includes('topic');
  if ($('qz-image')) $('qz-image').value = c.imageMode || 'none';
  if ($('qz-ugc')) $('qz-ugc').value = String(c.ugcRight ?? 4);

  const ai = c.aiImage || {};
  const isOpenAi = ai.provider === 'openai-compatible';
  if ($('qz-ai-pollinations')) $('qz-ai-pollinations').checked = !isOpenAi;
  if ($('qz-ai-openai')) $('qz-ai-openai').checked = isOpenAi;
  if ($('qz-ai-api')) $('qz-ai-api').hidden = !isOpenAi;
  if ($('qz-ai-baseurl')) $('qz-ai-baseurl').value = ai.baseUrl || '';
  if ($('qz-ai-model')) $('qz-ai-model').value = ai.model || 'flux';
  if ($('qz-ai-size')) $('qz-ai-size').value = ai.size || '1024x1024';
  if ($('qz-ai-prefix')) $('qz-ai-prefix').value = ai.promptPrefix || '';
  if ($('qz-ai-w')) $('qz-ai-w').value = ai.width ?? 768;
  if ($('qz-ai-h')) $('qz-ai-h').value = ai.height ?? 768;
  if ($('qz-ai-mask')) $('qz-ai-mask').textContent = ai.apiKey ? '（已设置，留空不改）' : '（未设置）';

  const led = $('qz-led');
  if (led) led.className = 'led' + (enabled ? ' ok' : '');
  if ($('qz-state')) $('qz-state').textContent = enabled ? (st.quiet ? '静默中，暂停' : '已启用') : '未启用';
  if ($('qz-sub')) {
    $('qz-sub').textContent = st.quiet
      ? '现在是静默时段，到点会自动跳过。'
      : '到点她自己发一条，只在非静默时段。';
  }
  if ($('qz-today')) $('qz-today').textContent = (st.today ?? 0) + ' / ' + (c.maxPerDay ?? 2) + ' 条';
  if ($('qz-last')) $('qz-last').textContent = qzFmtAgo(st.lastAt);
  if ($('qz-next')) $('qz-next').textContent = st.nextAt ? '约 ' + qzFmtTime(st.nextAt) : '—';
  if (st.lastError && $('qz-sub')) $('qz-sub').textContent = '上次出错：' + st.lastError;
}

// 上一次从 /api/qzone/status 读到的配置。发布时刻已改由时间窗口决定，
// 「间隔」两个值不再有输入框，保存时沿用配置里的旧值（后端仍会收下，只当兜底）。
let lastQzoneConf = null;

async function loadQzone() {
  try {
    const st = await consoleFetch('/api/qzone/status');
    lastQzoneConf = st.conf || null;
    qzFill(st);
    void loadQzoneRecent();
  } catch (error) {
    if ($('qz-state')) $('qz-state').textContent = '读不到状态';
    if ($('qz-sub')) $('qz-sub').textContent = String(error?.message ?? error);
  }
}

async function saveQzone() {
  const provider = $('qz-ai-openai')?.checked ? 'openai-compatible' : 'pollinations';
  const body = {
    enabled: !!$('qz-enabled')?.checked,
    maxPerDay: Number($('qz-max')?.value) || 0,
    skipChance: Math.min(0.9, Math.max(0, (Number($('qz-skip')?.value) || 0) / 100)),
    gapMinMin: lastQzoneConf?.gapMinMin ?? 180,
    gapMaxMin: lastQzoneConf?.gapMaxMin ?? 480,
    contentModes: (() => {
      const picked = [];
      if ($('qz-mode-daily')?.checked) picked.push('daily');
      if ($('qz-mode-topic')?.checked) picked.push('topic');
      return picked.length ? picked : ['daily'];
    })(),
    imageMode: $('qz-image')?.value || 'none',
    ugcRight: Number($('qz-ugc')?.value) || 4,
    aiImage: {
      provider,
      baseUrl: $('qz-ai-baseurl')?.value?.trim() || '',
      model: $('qz-ai-model')?.value?.trim() || 'flux',
      size: $('qz-ai-size')?.value?.trim() || '1024x1024',
      promptPrefix: $('qz-ai-prefix')?.value?.trim() || '',
      width: Number($('qz-ai-w')?.value) || 768,
      height: Number($('qz-ai-h')?.value) || 768
    }
  };
  const key = $('qz-ai-key')?.value?.trim();
  if (key) body.aiImage.apiKey = key;
  try {
    const st = await consoleFetch('/api/qzone/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    });
    if ($('qz-ai-key')) $('qz-ai-key').value = '';
    qzFill(st);
    if ($('qz-toast')) $('qz-toast').textContent = '已保存 ' + qzFmtTime(Date.now());
  } catch (error) {
    if ($('qz-toast')) $('qz-toast').textContent = '保存失败：' + (error?.message ?? error);
  }
}

async function postQzoneNow() {
  const force = !!$('qz-force')?.checked;
  const btn = $('qz-post');
  if (btn) btn.disabled = true;
  if ($('qz-toast')) $('qz-toast').textContent = '正在叫醒她…';
  try {
    const r = await consoleFetch('/api/qzone/trigger', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ force })
    });
    if ($('qz-toast')) $('qz-toast').textContent = r?.queued
      ? '她正在忙，排队中了，忙完就发'
      : '已叫她去写，几秒后看空间（' + (r?.key ?? '') + '）';
    setTimeout(() => void loadQzone(), 8000);
  } catch (error) {
    if ($('qz-toast')) $('qz-toast').textContent = '失败：' + (error?.message ?? error);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function fetchQzImageModels() {
  const baseUrl = $('qz-ai-baseurl')?.value?.trim() || '';
  const apiKey = $('qz-ai-key')?.value?.trim() || '';
  const hint = $('qz-ai-hint');
  if (hint) hint.textContent = '拉取中…';
  try {
    const r = await api('image-models', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ baseUrl, apiKey })
    });
    const list = r.models || [];
    if (hint) hint.textContent = list.length
      ? list.length + ' 个' + (r.filtered ? '（已按生图模型筛选）' : '（没识别出生图模型，全部列出）') + ' · ' + r.ms + 'ms'
      : '没拿到模型';
    const box = $('qz-ai-chips');
    if (box) {
      box.innerHTML = '';
      for (const m of list) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = m;
        b.onclick = () => { if ($('qz-ai-model')) $('qz-ai-model').value = m; };
        box.appendChild(b);
      }
    }
    if (list.length && !$('qz-ai-model')?.value) $('qz-ai-model').value = list[0];
  } catch (error) {
    if (hint) hint.textContent = '失败：' + (error?.message ?? error);
  }
}

async function loadQzoneRecent() {
  const box = $('qz-recent-list');
  if (!box) return;
  box.innerHTML = '<div class="empty" style="padding:20px"><div class="empty-title">读取中…</div></div>';
  try {
    const r = await consoleFetch('/api/qzone/recent');
    const items = Array.isArray(r.items) ? r.items : [];
    if (!items.length) {
      box.innerHTML = '<div class="empty" style="padding:28px"><div class="empty-icon">○</div><div class="empty-title">空间里还没有说说</div>等她发第一条就会出现在这里。</div>';
      return;
    }
    box.innerHTML = '';
    items.forEach((it, idx) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.gridTemplateColumns = '110px 1fr auto';
      const when = document.createElement('div');
      when.className = 'num';
      when.style.fontSize = '12px';
      when.textContent = it.at ? new Date(it.at * 1000).toLocaleString('zh-CN', { hour12: false }).slice(5, 16) : '#' + (idx + 1);
      const body = document.createElement('div');
      body.className = 'remark-text';
      body.style.whiteSpace = 'pre-wrap';
      body.style.fontSize = '12.5px';
      body.textContent = String(it.content || '').slice(0, 160);
      const del = document.createElement('button');
      del.className = 'btn mini danger';
      del.type = 'button';
      del.textContent = '删除';
      del.onclick = () => void deleteQzoneItem(it.tid, String(it.content || '').slice(0, 30));
      row.appendChild(when);
      row.appendChild(body);
      row.appendChild(del);
      box.appendChild(row);
    });
  } catch (error) {
    box.innerHTML = '<div class="empty" style="padding:20px"><div class="empty-title">读不到</div>' + String(error?.message ?? error) + '</div>';
  }
}

async function deleteQzoneItem(tid, preview) {
  const ok = await askConfirm({
    title: '删掉这条说说？',
    body: '「' + preview + '…」<br>删了就没了，空间里也看不到。',
    okText: '确认删除'
  });
  if (!ok) return;
  try {
    await consoleFetch('/api/qzone/delete', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ tid })
    });
    if ($('qz-toast')) $('qz-toast').textContent = '已删除';
    await loadQzoneRecent();
  } catch (error) {
    if ($('qz-toast')) $('qz-toast').textContent = '删除失败：' + (error?.message ?? error);
  }
}

if ($('qz-recent-refresh')) $('qz-recent-refresh').onclick = () => void loadQzoneRecent();

if ($('qz-ai-openai')) $('qz-ai-openai').onchange = () => { if ($('qz-ai-api')) $('qz-ai-api').hidden = false; };
if ($('qz-ai-pollinations')) $('qz-ai-pollinations').onchange = () => { if ($('qz-ai-api')) $('qz-ai-api').hidden = true; };
if ($('qz-save')) $('qz-save').onclick = () => void saveQzone();
if ($('qz-post')) $('qz-post').onclick = () => void postQzoneNow();
if ($('qz-ai-fetch')) $('qz-ai-fetch').onclick = () => void fetchQzImageModels();

  if (id === 'qq') { void loadQQ(); }

// 同源 iframe：只借控制台的主内容区，它自己的侧栏/顶栏在这里是多余的，直接从页面里去掉。
function showConsolePage(page) {
  if (!botRunning) { showNotice(); return; }
  if (!frame) {
    frame = document.createElement('iframe');
    frame.title = '功能设置';
    frame.src = '/console/#' + page;
    framePage = page;
    frame.onload = () => {
      try {
        const doc = frame.contentDocument;
        const st = doc.createElement('style');
        st.textContent = `
          .sidebar{display:none!important}
          .workspace{margin-left:0!important}
          .topbar{display:none!important}
          .skip-link{display:none!important}
          .bg-decor{display:none!important}
          .page-heading{display:none!important}
          /* 这三块在面板里有独立入口，控制台这边不再重复露出 */
          #section-whitelist{display:none!important}
          #section-silent{display:none!important}
          main{padding:0 0 28px!important}
          body{background:transparent!important}
          .card{border-radius:12px!important;box-shadow:none!important}
          .card:hover{transform:none!important}
        `;
        doc.head.appendChild(st);
        // 「二代仿真」里的发送限制折叠区与「聊天行为」页重复，面板里隐藏（控制台本身不动）。
        try {
          for (const d of doc.querySelectorAll('details.settings-group')) {
            const s = d.querySelector('summary');
            if (s && /发送限制/.test(s.textContent)) d.style.display = 'none';
          }
        } catch (e) {}
        guardConsoleDeletes(doc, frame.contentWindow);
        setTimeout(() => { try { const w = frame.contentWindow; if (w && typeof w.refresh === 'function') void w.refresh(); } catch (e) {} }, 2500);
        if (typeof frame.contentWindow.setConsolePage === 'function' && framePage) {
          frame.contentWindow.setConsolePage(framePage, { updateHash: false });
        }
      } catch (e) { /* 同源失败就退回普通 iframe 行为 */ }
    };
    const view = document.createElement('section');
    view.className = 'view embed';
    view.dataset.view = '__console';
    const shell = document.createElement('div');
    shell.className = '';
    shell.style.cssText = 'height:100vh;overflow:hidden;background:transparent';
    frame.style.cssText = 'width:100%;height:100vh;border:0;display:block;background:var(--surface)';
    shell.appendChild(frame);
    view.appendChild(shell);
    $('main').appendChild(view);
  }
  const view = document.querySelector('.view[data-view="__console"]');
  const notice = document.querySelector('.view[data-view="__notice"]');
  if (notice) notice.remove();
  if (view) view.hidden = false;
  if (framePage !== page) {
    framePage = page;
    try { frame.contentWindow.setConsolePage(page, { updateHash: false }); }
    catch (e) { frame.src = '/console/#' + page; }
  }
}

async function api(path, options) {
  const res = await fetch('/panel/api/' + path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
function toast(id, text, isErr) {
  // 两种调用都认：toast('一句话') 和 toast('锚点id', '一句话', isErr)。
  if (text === undefined) { text = id; isErr = false; }
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'toast-host';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = isErr ? 'toast err' : 'toast';
  el.textContent = String(text ?? '');
  host.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; }, 2300);
  setTimeout(() => { el.remove(); }, 2700);
}

// ── 破坏性操作确认层 ────────────────────────────────────
// 原生 confirm 不够用：拦不住 iframe 里的按钮，也说不清「删的到底是哪个文件」。
// 所以统一走这里：默认焦点在「取消」，确认按钮还要等 1.2 秒才可点，防手滑连点。
let confirmResolve = null;
let confirmArmTimer = null;

function askConfirm(options) {
  return new Promise(function (resolve) {
    confirmResolve = resolve;
    $('confirm-title').textContent = options.title || '确认操作';
    $('confirm-body').innerHTML = options.body || '';
    $('confirm-ok').textContent = options.okText || '确认删除';
    $('confirm-ok').disabled = true;
    $('confirm-mask').hidden = false;
    $('confirm-cancel').focus();
    clearTimeout(confirmArmTimer);
    confirmArmTimer = setTimeout(function () { $('confirm-ok').disabled = false; }, 1200);
  });
}

function closeConfirm(ok) {
  clearTimeout(confirmArmTimer);
  $('confirm-mask').hidden = true;
  const fn = confirmResolve;
  confirmResolve = null;
  if (fn) fn(!!ok);
}

$('confirm-cancel').onclick = () => closeConfirm(false);
$('confirm-ok').onclick = () => closeConfirm(true);
document.addEventListener('keydown', function (e) {
  if (!$('confirm-mask').hidden && e.key === 'Escape') closeConfirm(false);
});

// 控制台里的「删除/清空/重置」按钮也接上同一套确认：
// 用捕获阶段拦下点击，确认后再放行，并把它自己那句 window.confirm 暂时放行（避免连弹两次）。
function guardConsoleDeletes(doc, win) {
  if (doc.__confirmGuarded) return;
  doc.__confirmGuarded = true;
  doc.addEventListener('click', function (event) {
    const btn = event.target && event.target.closest ? event.target.closest('button, a') : null;
    if (!btn) return;
    const label = (btn.textContent || '').replace(/\s+/g, ' ').trim();
    if (!label || !/删除|移除|清空|重置|撤销/.test(label)) return;
    if (btn.dataset.confirmBypass === '1') { delete btn.dataset.confirmBypass; return; }
    event.preventDefault();
    event.stopPropagation();
    askConfirm({
      title: '确认执行「' + label + '」？',
      body: '这个操作不可撤销。确认后立即执行。',
      okText: '确认执行'
    }).then(function (ok) {
      if (!ok) return;
      btn.dataset.confirmBypass = '1';
      const realConfirm = win.confirm;
      win.confirm = function () { return true; };
      try { btn.click(); } finally { win.confirm = realConfirm; }
    });
  }, true);
}

// ── 机器人状态卡：静默 / 观察 / 潜水 / 思考中 ────────────────
function fmtClock(ms) {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtAgo(ms) {
  if (!ms) return '—';
  const diff = Date.now() - ms;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  return Math.floor(diff / 86400000) + ' 天前';
}
const WAKE_REASON = {
  atMention: '被 @', question: '被提问', poke: '拍一拍', proactiveCheck: '主动搭话',
  replyCheck: '等回复', admin: '手动', nameMention: '叫名字', probability: '随机醒', anyMessage: '新消息'
};

// 判断顺序就是「它现在最该被理解成什么状态」：暂停 > 正在干活 > 静默 > 观察/潜水 > 待命。
function liveVerdict(d) {
  if (!d || d.ok === false) return { text: '未运行', cls: '', sub: '机器人没启动，或者控制台连不上。' };
  if (d.paused) return { text: '已暂停', cls: 'warn', sub: '二代 AI 已暂停：不主动说话，也不回消息。' };
  const conv = (d.conversations || [])[0] || null;
  if ((d.busyKeys || []).length) {
    return { text: '思考中', cls: 'ok', sub: '正在读消息、组织回复' + (conv ? '（' + conv.key + '）' : '') + '。' };
  }
  const q = d.quiet || {};
  if (q.state && q.state !== 'normal') {
    return { text: '静默中', cls: 'warn', sub: (q.reason || '静默时段') + '（' + (q.window || '—') + '）；到点自动恢复。' };
  }
  if (!conv) return { text: '待命', cls: 'ok', sub: '还没跟任何人聊过，等消息。' };
  if (conv.observing) return { text: '观察中', cls: 'ok', sub: '沉睡前在等对方有没有下文，没人说话就收尾。' };
  if (conv.pendingWake) return { text: '准备唤醒', cls: 'ok', sub: '收到消息了，合并窗口快到点。' };
  if (conv.sleeping) {
    return { text: '潜水', cls: '', sub: fmtClock(conv.sleepUntil) + ' 之后醒来（约 ' + Math.max(1, Math.round((conv.sleepUntil - Date.now()) / 60000)) + ' 分钟）。' };
  }
  if (conv.wakeMode === 'diving') return { text: '待唤醒', cls: '', sub: '已进入潜水，有人叫它就会醒。' };
  return { text: '待命', cls: 'ok', sub: '在线，等消息。' };
}

async function loadLive() {
  let d = null;
  try { d = await api('live'); } catch { d = { ok: false }; }
  const v = liveVerdict(d);
  $('live-state').textContent = v.text;
  $('live-sub').textContent = v.sub;
  $('live-led').className = 'led ' + v.cls;
  const conv = (d && d.ok !== false && (d.conversations || [])[0]) || null;
  const facts = [
    ['会话', conv ? conv.key.replace('group:', '群 ').replace('private:', '好友 ') : '—'],
    ['未读', conv ? String(conv.unread ?? 0) : '—'],
    ['上次唤醒', conv ? (WAKE_REASON[conv.lastWakeReason] || conv.lastWakeReason || '—') : '—'],
    ['上次说话', conv ? fmtAgo(conv.lastAiReplyAt) : '—']
  ];
  $('live-facts').innerHTML = facts.map(function (pair) {
    return '<div class="stat"><div class="stat-label">' + pair[0] + '</div><div class="stat-value" style="font-size:15px">' + pair[1] + '</div></div>';
  }).join('');
}

let logWhich = 'bridge';
let logLines = [];
let logLevel = 'all';
let logQuery = '';

// 只做粗分级：日志是自己拼的字符串，认几个关键字就够区分「有事」和「没事」。
function logLevelOf(line) {
  if (/\b(error|err|fatal)\b|失败|异常|Error|✗|❌/i.test(line)) return 'err';
  if (/\b(warn|warning)\b|警告|⚠|超时|重试/i.test(line)) return 'warn';
  return 'info';
}
function renderLog() {
  const box = $('log');
  if (!box) return;
  let lines = logLines;
  if (logLevel === 'warn') lines = lines.filter((l) => logLevelOf(l) !== 'info');
  if (logLevel === 'err') lines = lines.filter((l) => logLevelOf(l) === 'err');
  const q = logQuery.trim().toLowerCase();
  if (q) lines = lines.filter((l) => l.toLowerCase().includes(q));
  if (!lines.length) {
    box.innerHTML = '<div class="info" style="color:var(--muted)">' + (logLines.length ? '（没有符合筛选条件的日志）' : '（还没有日志）') + '</div>';
    return;
  }
  box.innerHTML = lines

// 密钥框的占位圆点：填过的 key 不回传明文（后端只给 hasKey），
// 但空着会让人以为「没填」。所以框里放一串圆点表示「已经存了」，
// 保存时再把圆点当空值处理——不传就沿用服务器上的旧 key。
const MASK_DOTS = '••••••••••••';
const MASKED_INPUTS = ['apiKey', 'ttsApiKey', 'webSearchApiKey', 'accessToken', 'consoleToken'];
// 用户点进过哪个框，就不再自动补圆点（否则刚清空、还没打字，又被填回去）。
const maskTouched = new Set();
function maskFill(id, has) {
  const el = $(id);
  if (!el) return;
  if (!has) {
    if (el.value === MASK_DOTS) el.value = '';
    return;
  }
  if (maskTouched.has(id)) return;
  if (!el.value) el.value = MASK_DOTS;
}
MASKED_INPUTS.forEach((id) => {
  const el = $(id);
  if (!el) return;
  // 点进去就清掉圆点，直接打新的；不输入就走开，下一轮状态刷新会把圆点补回来。
  el.addEventListener('focus', () => {
    if (el.value === MASK_DOTS) el.value = '';
    maskTouched.add(id);
  });
  el.addEventListener('blur', () => maskTouched.delete(id));
});
// 圆点 / 空 → undefined（JSON 里不出现这个键，后端就不会覆盖）
function unmaskKey(v) {
  const s = String(v ?? '').trim();
  if (!s) return undefined;
  return /^[•·*]+$/.test(s) ? undefined : s;
}

// 两个自建页共用同一份表单：保存时总是提交全部字段，避免只改一部分把别的键清掉。
async function saveAll(btnId, toastId) {

        wsUrl: $('wsUrl').value, httpUrl: $('httpUrl').value, accessToken: unmaskKey($('accessToken').value),
        // 对话范围（群/好友/停用/备注/管理员/端口）只在「对话范围」页保存，

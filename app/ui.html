// ── 对话范围（列表式） ───────────────────────────────────
// 启用/停用是两摞名单：启用的放 allow.groups / allow.private（bridge 只读这两个），
// 关掉的挪进 allow.disabled.*，备注存在 allow.names。
const scopeState = { groups: [], private: [], disabled: { groups: [], private: [] }, names: {} };
const scopeFilter = { g: 'all', p: 'all' };
const scopeSearch = { g: '', p: '' };

function scopeEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}
function scopeKey(kind) { return kind === 'g' ? 'groups' : 'private'; }
function scopeRows(kind) {
  const k = scopeKey(kind);
  const on = Array.isArray(scopeState[k]) ? scopeState[k] : [];
  const off = Array.isArray(scopeState.disabled?.[k]) ? scopeState.disabled[k] : [];
  const rows = [];
  for (const n of on) rows.push({ num: n, enabled: true });
  for (const n of off) rows.push({ num: n, enabled: false });
  return rows.sort((a, b) => a.num - b.num);
}
function scopeSnapshot() {
  return {
    groups: [...scopeState.groups],
    private: [...scopeState.private],
    disabledGroups: [...(scopeState.disabled?.groups ?? [])],
    disabledPrivate: [...(scopeState.disabled?.private ?? [])],
    allowNames: { ...scopeState.names }
  };
}
function renderScope(kind) {
  const list = $('sc-' + kind + '-list');
  if (!list) return;
  const f = scopeFilter[kind];
  const q = scopeSearch[kind].trim();
  let rows = scopeRows(kind);
  if (f === 'on') rows = rows.filter((r) => r.enabled);
  if (f === 'off') rows = rows.filter((r) => !r.enabled);
  if (q) rows = rows.filter((r) => String(r.num).includes(q) || (scopeState.names?.[r.num] ?? '').includes(q));

  const onG = scopeState.groups.length;
  const onP = scopeState.private.length;
  const offAll = (scopeState.disabled?.groups?.length ?? 0) + (scopeState.disabled?.private?.length ?? 0);
  if ($('sc-g-count')) $('sc-g-count').innerHTML = onG + ' <small>启用 ' + onG + ' / 停用 ' + (scopeState.disabled?.groups?.length ?? 0) + '</small>';
  if ($('sc-p-count')) $('sc-p-count').innerHTML = onP + ' <small>启用 ' + onP + ' / 停用 ' + (scopeState.disabled?.private?.length ?? 0) + '</small>';
  if ($('sc-d-count')) $('sc-d-count').innerHTML = offAll + ' <small>保留配置但不回</small>';
  if ($('sc-g-cnt')) $('sc-g-cnt').textContent = String(onG + (scopeState.disabled?.groups?.length ?? 0));
  if ($('sc-p-cnt')) $('sc-p-cnt').textContent = String(onP + (scopeState.disabled?.private?.length ?? 0));

  if (!rows.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">○</div><div class="empty-title">' +
      (scopeRows(kind).length ? '没有匹配的号码' : '这里还是空的') + '</div><div>' +
      (scopeRows(kind).length ? '换个关键词，或切到「全部」'
        : (kind === 'g' ? '在上面输入群号，点「添加」；或用「从已有会话导入」' : '在上面输入 QQ 号，点「添加」')) +
      '</div></div>';
    return;
  }
  list.innerHTML = rows.map((r, i) => {
    const note = scopeState.names?.[r.num] ?? '';
    return '<div class="row' + (r.enabled ? '' : ' off') + '" data-num="' + r.num + '">' +
      '<div class="row-index">' + (i + 1) + '</div>' +
      '<div class="num">' + r.num + '</div>' +
      '<input class="remark-text" value="' + scopeEsc(note) + '" placeholder="无备注" maxlength="40">' +
      '<div class="badge ' + (r.enabled ? 'on' : 'off') + '"><i></i>' + (r.enabled ? '启用' : '停用') + '</div>' +
      '<div class="row-actions">' +
        '<button class="switch' + (r.enabled ? ' on' : '') + '" title="' + (r.enabled ? '点一下停用' : '点一下启用') + '"></button>' +
        '<button class="btn mini danger" title="从名单里删掉">' + scopeTrash() + '删除</button>' +
      '</div></div>';
  }).join('');

  for (const row of list.querySelectorAll('.row')) {
    const num = Number(row.dataset.num);
    row.querySelector('.switch').onclick = () => scopeMove(kind, num, !row.querySelector('.switch').classList.contains('on'));
    row.querySelector('.remark-text').onchange = (ev) => {
      const v = ev.target.value.trim();
      if (!scopeState.names) scopeState.names = {};
      if (v) scopeState.names[String(num)] = v.slice(0, 40);
      else delete scopeState.names[String(num)];
    };
    row.querySelector('.btn.danger').onclick = async () => {
      const note = scopeState.names?.[num] ? '（' + scopeState.names[num] + '）' : '';
      const ok = await askConfirm({
        title: '从名单里删掉 ' + num + '？',
        body: '这个号码' + note + '会从' + (kind === 'g' ? '群聊' : '好友') + '白名单里彻底移除，备注也一起删。<br>以后要让机器人再理它，得重新添加。',
        okText: '删掉'
      });
      if (ok) scopeRemove(kind, num);
    };
  }
}

function scopeTrash() {
  return '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6 7l1 13h10l1-13"/></svg>';
}

function scopeMove(kind, num, enabled) {
  const k = scopeKey(kind);
  if (!scopeState.disabled) scopeState.disabled = { groups: [], private: [] };
  const on = new Set(scopeState[k] ?? []);
  const off = new Set(scopeState.disabled[k] ?? []);
  if (enabled) { off.delete(num); on.add(num); } else { on.delete(num); off.add(num); }
  scopeState[k] = [...on].sort((a, b) => a - b);
  scopeState.disabled[k] = [...off].sort((a, b) => a - b);
  renderScope(kind);
  toast('toast-' + kind, (enabled ? '已启用 ' : '已关掉 ') + num + '（记得点保存）');
}
function scopeRemove(kind, num) {
  const k = scopeKey(kind);
  scopeState[k] = (scopeState[k] ?? []).filter((n) => n !== num);
  scopeState.disabled[k] = (scopeState.disabled?.[k] ?? []).filter((n) => n !== num);
  if (scopeState.names) delete scopeState.names[String(num)];
  renderScope(kind);
  toast('toast-' + kind, '已删掉 ' + num + '（记得点保存）');
}
function scopeAdd(kind) {
  const raw = String($('sc-' + kind + '-input').value || '').trim();
  const noteBox = $('sc-' + kind + '-note');
  const note = String(noteBox?.value || '').trim();
  if (!/^[0-9]{5,12}$/.test(raw)) {
    toast('toast-' + kind, '号码不对：应该是 5–12 位数字', true);
    return;
  }
  const num = Number(raw);
  const k = scopeKey(kind);
  const all = [...(scopeState[k] ?? []), ...(scopeState.disabled?.[k] ?? [])];
  const had = all.includes(num);
  if (!had) scopeState[k] = [...(scopeState[k] ?? []), num].sort((a, b) => a - b);
  if (note) {
    if (!scopeState.names) scopeState.names = {};
    scopeState.names[String(num)] = note.slice(0, 40);
  }
  $('sc-' + kind + '-input').value = '';
  if (noteBox) noteBox.value = '';
  renderScope(kind);
  toast('toast-' + kind, (had ? '已经在名单里了：' : '已添加 ') + num + (had ? '' : '（记得点保存）'));
}
async function loadScope() {
  let cfg = null;
  try {
    const s = await api('status');
    cfg = s.config;
  } catch (e) {
    toast('toast-g', '读配置失败：' + e.message, true);
    return;
  }
  if (!cfg) return;
  scopeState.groups = Array.isArray(cfg.groups) ? [...cfg.groups] : [];
  scopeState.private = Array.isArray(cfg.private) ? [...cfg.private] : [];
  scopeState.disabled = {
    groups: Array.isArray(cfg.disabledGroups) ? [...cfg.disabledGroups] : [],
    private: Array.isArray(cfg.disabledPrivate) ? [...cfg.disabledPrivate] : []
  };
  scopeState.names = cfg.names && typeof cfg.names === 'object' ? { ...cfg.names } : {};
  if ($('sc-dn-groups')) $('sc-dn-groups').value = (cfg.denyGroups || []).join(', ');
  if ($('sc-dn-private')) $('sc-dn-private').value = (cfg.denyPrivate || []).join(', ');
  if ($('sc-owner')) $('sc-owner').textContent = cfg.ownerQQ ? String(cfg.ownerQQ) : '—';
  if ($('ownerQQ')) $('ownerQQ').value = cfg.ownerQQ ? String(cfg.ownerQQ) : '';
  if ($('consolePort')) $('consolePort').value = cfg.consolePort ? String(cfg.consolePort) : '';
  renderScope('g');
  renderScope('p');
}
// 从控制台已有的会话里把群/好友捞出来，省得手抄。
async function scopeImport() {
  const btn = $('sc-import');
  if (btn) btn.disabled = true;
  try {
    const live = await api('live');
    const keys = (live.conversations ?? []).map((x) => String(x.key ?? ''));
    let added = 0;
    for (const key of keys) {
      const m = key.match(/^(group|private):([0-9]{5,12})$/);
      if (!m) continue;
      const kind = m[1] === 'group' ? 'g' : 'p';
      const k = scopeKey(kind);
      const num = Number(m[2]);
      const all = [...(scopeState[k] ?? []), ...(scopeState.disabled?.[k] ?? [])];
      if (all.includes(num)) continue;
      scopeState[k] = [...(scopeState[k] ?? []), num].sort((a, b) => a - b);
      added++;
    }
    renderScope('g');
    renderScope('p');
    toast('toast-g', added ? '导入 ' + added + ' 个（记得点保存）' : '没有新的会话可导入');
  } catch (e) {
    toast('toast-g', '导入失败：' + e.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}
async function saveScope(btnId, toastId) {
  const btn = $(btnId);

    void refreshStatus();

    toast(toastId, '保存失败：' + e.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── 聊天行为（主动搭话 / 说话上限）──────────────────────────────
function chatFill(pa, sp) {
  const set = (id, v) => { const el = $(id); if (el) el.value = v == null ? '' : v; };
  const chk = (id, v) => { const el = $(id); if (el) el.checked = !!v; };
  chk('paEnabled', pa.enabled); chk('paGroup', pa.group); chk('paPrivate', pa.private);
  set('paMin', Math.round((pa.checkIntervalMinMs || 0) / 60000));
  set('paMax', Math.round((pa.checkIntervalMaxMs || 0) / 60000));
  set('paIdle', Math.round((pa.idleThresholdMs || 0) / 60000));
  set('paProb', pa.probability);
  set('paMaxDay', pa.maxPerDay);
  set('paNightFrom', pa.nightFrom || '');
  set('paNightTo', pa.nightTo || '');
  set('paWindow', pa.windowDays);
  set('spPerMin', sp.maxSendPerMinute);
  set('spPerHour', sp.maxSendPerHour);
  set('spChars', sp.maxMessageChars);
  set('spBurst', sp.burstMaxMessages);
  set('spGapMin', (sp.burstIntervalMinMs || 0) / 1000);
  set('spGapMax', (sp.burstIntervalMaxMs || 0) / 1000);
}

// ── 令牌用量（只记 token 与缓存，不折算金额）──────────────────────────
function tkNum(n) {
  const v = Number(n) || 0;
  if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 亿';
  if (v >= 1e4) return (v / 1e4).toFixed(1) + ' 万';
  return String(Math.round(v));
}
function tkTime(ms) {
  if (!ms) return '—';
  const d = new Date(Number(ms));
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function renderUsage(j) {
  const t = j?.totals ?? {};
  const b = t.buckets ?? {};
  $('tk-miss').textContent = tkNum(b.cacheMiss);
  $('tk-hit').textContent = tkNum(b.cacheHit);
  $('tk-out').textContent = tkNum(b.output);
  $('tk-think').textContent = tkNum(b.reasoning);
  $('tk-total').textContent = tkNum(t.totalTokens);
  $('tk-rate').textContent = ((Number(t.cacheHitRate) || 0) * 100).toFixed(1) + '%';
  $('tk-turns').textContent = tkNum(t.turns);
  $('tk-steps').textContent = tkNum(t.steps);
  $('tk-convs').textContent = tkNum(t.conversations);
  const perTurn = (Number(t.turns) || 0) > 0 ? (Number(t.totalTokens) || 0) / Number(t.turns) : 0;
  $('tk-perturn').textContent = tkNum(perTurn);
  $('tk-since').textContent = j?.generatedAt ? '更新于 ' + tkTime(j.generatedAt) : '—';

  const list = Array.isArray(j?.conversations) ? j.conversations : [];
  const box = $('tk-list');
  const cnt = $('tk-conv-count');
  if (cnt) cnt.textContent = String(list.length);
  if (!list.length) {
    box.innerHTML = '<div class="empty"><div class="empty-icon">○</div><div class="empty-title">还没有用量记录</div><div>等机器人跑过一两轮就会出现在这里。</div></div>';
    return;
  }
  box.innerHTML = list.map(function (c) {
    const cb = c.buckets ?? {};
    const rate = (Number(cb.cacheHit) || 0) + (Number(cb.cacheMiss) || 0) > 0
      ? ((Number(cb.cacheHit) || 0) / ((Number(cb.cacheHit) || 0) + (Number(cb.cacheMiss) || 0)) * 100).toFixed(1) + '%'
      : '—';
    const models = Array.isArray(c.models) && c.models.length ? c.models.map(function (m) {
      return typeof m === 'string' ? m : (m.name || m.model || '');
    }).filter(Boolean).join(' / ') : '—';
    const name = String(c.key ?? '').replace(/^(group|private):/, function (_m, k) { return k === 'group' ? '群 ' : '私聊 '; });
    return '<div class="row" style="grid-template-columns:1fr auto auto auto auto">'
      + '<div><div class="num" style="font-family:inherit;font-size:13px">' + scopeEsc(name) + '</div>'
      + '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + scopeEsc(models) + ' · 最后 ' + tkTime(c.lastAt) + '</div></div>'
      + '<div style="text-align:right"><div style="font-size:11px;color:var(--muted)">回合</div><div>' + tkNum(c.turns) + '</div></div>'
      + '<div style="text-align:right"><div style="font-size:11px;color:var(--muted)">输入</div><div>' + tkNum((Number(cb.cacheMiss) || 0) + (Number(cb.cacheHit) || 0)) + '</div></div>'
      + '<div style="text-align:right"><div style="font-size:11px;color:var(--muted)">输出</div><div>' + tkNum(cb.output) + '</div></div>'
      + '<div style="text-align:right"><div style="font-size:11px;color:var(--muted)">命中率</div><div>' + rate + '</div></div>'
      + '</div>';
  }).join('');
}

  const btn = $('tk-refresh');

let rpState = { roles: [], current: '', defaults: {} };

function pickRole(name) {
  const item = rpState.roles.find((r) => r.name === name) || { name };
  $('rp-role').value = name;
  $('rp-voice').value = item.voiceId || '';
  $('rp-aliases').value = (item.aliases || []).join('\n');
  $('rp-dict').value = item.dictionary ? JSON.stringify(item.dictionary, null, 2) : '';
  $('rp-world').value = item.worldName || '';
  $('rp-toast').textContent = item.hasPack
    ? '已加载「' + name + '」的角色包（' + (item.dictionaryCount || 0) + ' 条注音'
      + (item.voiceId ? '，有音色' : '，**没写音色 → 这个角色不会发语音**') + '）'
    : '「' + name + '」还没有角色包：填完点保存就会生成；在此之前它不会发语音';
  $('rp-del').disabled = !item.hasPack;
  for (const b of document.querySelectorAll('#rp-list .rl-item')) b.classList.toggle('active', b.dataset.role === name);
}

async function loadRolePacks() {
  try {
    const r = await api('rolepacks');
    rpState = { roles: r.roles || [], current: r.currentRole || '', defaults: r.configDefaults || {} };
    $('rp-list').innerHTML = rpState.roles.map(function (item) {
      const tag = item.hasPack ? (item.voiceId ? (item.dictionaryCount || 0) + ' 词' : '无音色') : '无包';
      return '<div class="rl-item" data-role="' + item.name + '">'
        + '<span class="rl-name">' + item.name + '</span>'
        + '<span class="rl-num">' + tag + '</span></div>';
    }).join('');
    for (const b of document.querySelectorAll('#rp-list .rl-item')) b.onclick = function () { pickRole(b.dataset.role); };
    const first = rpState.roles.some((x) => x.name === rpState.current) ? rpState.current : (rpState.roles[0] || {}).name;
    if (first) pickRole(first);
  } catch (e) {
    $('rp-toast').textContent = '读取失败：' + e.message;

}

  $('rp-aliases').value = (cur.aliases || []).join('\n');

// 把拿到的模型渲染成一排可点的标签：比 datalist 可控——datalist 会把建议值粘在输入框上，
// 用户想改成列表外的名字时会被自动填充顶掉（实测反馈「出现自动填充，之后改不了」）。
function renderModelChips(containerId, inputId, list) {
  const box = $(containerId);
  const input = $(inputId);
  if (!box) return;
  box.innerHTML = (list || []).map(function (m) {
    const v = String(m);
    const on = input && input.value === v ? ' on' : '';
    return '<span class="chip' + on + '" data-v="' + v.replace(/"/g, '&quot;') + '">' + v.replace(/</g, '&lt;') + '</span>';
  }).join('');
  if (box.dataset.bound === '1') return;
  box.dataset.bound = '1';
  box.addEventListener('click', function (ev) {
    const chip = ev.target.closest('.chip');
    if (!chip || !input) return;
    input.value = chip.dataset.v || '';
    for (const c of box.querySelectorAll('.chip')) c.classList.toggle('on', c === chip);
  });
}

async function loadChatTargets() {
  const sel = $('pa-target');
  if (!sel) return;
  try {
    const r = await api('status');
    const cfg = r.config || {};
    const names = cfg.names || {};
    const canGroup = cfg.proactiveGroup !== false;
    const opts = [];
    for (const g of (cfg.groups || [])) {
      const label = names[String(g)] ? ('群 ' + g + '（' + names[String(g)] + '）') : ('群 ' + g);
      opts.push({ v: 'group:' + g, t: label + (canGroup ? '' : '（群内主动已关）') });
    }
    for (const p of (cfg.private || [])) {
      const label = names[String(p)] ? ('私聊 ' + p + '（' + names[String(p)] + '）') : ('私聊 ' + p);
      opts.push({ v: 'private:' + p, t: label + (cfg.proactivePrivate ? '' : '（私聊主动默认关，手动仍可发）') });
    }
    const keep = sel.value;
    sel.innerHTML = opts.length
      ? opts.map((o) => '<option value="' + scopeEsc(o.v) + '">' + scopeEsc(o.t) + '</option>').join('')
      : '<option value="">（对话范围里还没有启用的群或好友）</option>';
    if (keep && opts.some((o) => o.v === keep)) sel.value = keep;
  } catch (e) {
    const sel2 = $('pa-target');
    if (sel2) sel2.innerHTML = '<option value="">（读取失败：' + scopeEsc(e?.message ?? String(e)) + '）</option>';
  }
}

// 桥接控制台的接口不在 /panel/api 下，走面板的同源反向代理：路径原样，令牌由服务端注入。
async function consoleFetch(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function collectQuiet() {
  const read = function (kind) {
    return [...document.querySelectorAll('#q-' + kind + '-rows > div')].map(function (row) {
      const inputs = row.querySelectorAll('input[type="time"]');
      return [inputs[0] ? inputs[0].value : '', inputs[1] ? inputs[1].value : ''];
    }).filter(function (pair) { return pair[0] && pair[1] && pair[0] !== pair[1]; });
  };
  return {
    enabled: $('q-enabled').checked,
    holidays: $('q-holidays').value,
    workday: {
      weekdays: [...document.querySelectorAll('#q-weekdays button')]
        .filter(function (b) { return b.classList.contains('primary'); })
        .map(function (b) { return Number(b.dataset.day); }),
      windows: read('workday')
    },
    offday: { windows: read('offday') }
  };
}

function renderQuietStatus(s) {
  if (!s || typeof s !== 'object') { $('q-now').textContent = '读不到状态'; return; }
  const fmtWin = function (w) {
    if (!Array.isArray(w) || w.length !== 2) return '无';
    const hm = function (m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
    return hm(w[0]) + '–' + hm(w[1]);
  };
  const quiet = s.state === 'quiet';
  const override = s.state === 'override';
  $('q-led').className = 'led ' + (quiet || override ? 'warn' : 'ok');
  $('q-now').textContent = quiet
    ? '静默中'
    : override
      ? '临时覆盖中（被动模式）'
      : (s.enabled === false ? '静默功能已关闭' : '正常');
  const dayKind = s.workday ? '工作日' : '周末与法定节假日';
  const tail = quiet && s.until ? '，' + fmtClock(s.until) + ' 结束' : '';
  $('q-now-sub').textContent = '今天算「' + dayKind + '」' + (s.holiday ? '（' + s.holiday + '）' : '')
    + '，按这一套时段判断' + tail + '。';
  const facts = [
    ['今天', s.date + ' 周' + WEEKDAY_NAMES[(new Date(s.date + 'T12:00:00+08:00').getDay() + 6) % 7]],
    ['本地时间', s.localTime],
    ['当前时段', fmtWin(s.window)],
    ['已抑制', String(s.suppressed == null ? 0 : s.suppressed)]
  ];
  $('q-now-facts').innerHTML = facts.map(function (pair) {
    return '<div><div class="hint" style="margin:0">' + pair[0] + '</div><div style="font-weight:600;margin-top:2px">' + pair[1] + '</div></div>';
  }).join('');
}

async function loadQuiet() {
  try {
    const s = await consoleFetch('/api/quiet-hours');
    $('q-enabled').checked = s.enabled !== false;
    $('q-holidays').value = s.holidays === 'none' ? 'none' : 'cn';
    renderQuietWeekdays(s.weekdays || [1, 2, 3, 4, 5]);
    renderQuietRows('workday', s.workdayWindows || []);
    renderQuietRows('offday', s.offdayWindows || []);
    renderQuietStatus(s);
  } catch (e) {
    $('q-now').textContent = '读取失败：' + e.message;
  }
}

function pgStickerLabel(s) {
  const d = s.desc || s.localNote || s.md5 || s.id || '';
  return String(d).slice(0, 30);
}
async function loadPgStickers(selected) {
  const sel = $('pg-sticker');
  if (!sel) return;
  try {
    const r = await consoleFetch('/api/stickers?count=100');
    const list = Array.isArray(r.stickers) ? r.stickers : (Array.isArray(r.entries) ? r.entries : []);
    sel.innerHTML = '<option value="">（不发表情，只发文字）</option>' + list.map(function (s) {
      const id = String(s.id || s.resId || s.md5 || s.url || '');
      const label = pgStickerLabel(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return '<option value="' + id.replace(/"/g, '&quot;') + '">' + label + '</option>';
    }).join('');
    if (selected) sel.value = selected;
  } catch (e) { /* 取不到就只留空选项，不影响保存 */ }
}

function applyQQ(q) {
  q = q || {};
  const running = !!q.running;
  const led = $('qq-led');
  if (led) {
    led.style.background = running ? 'var(--ok,#22c55e)' : 'var(--muted,#c9ced9)';
    led.style.boxShadow = running ? '0 0 0 3px rgba(34,197,94,.16)' : 'none';
  }
  if ($('qq-now')) $('qq-now').textContent = running ? 'QQ 运行中' : 'QQ 没在跑';
  if ($('qq-now-sub')) {
    $('qq-now-sub').textContent = running
      ? '网关会自动注入它；如果还没上线，等一会儿或看网关日志。'
      : (q.legacyRunning
        ? '机器上跑着老版 QQ（不支持注入）：请退出它，再启动 QQNT 版。'
        : (q.configured ? '启动面板时会自动拉起；也可以点右边按钮现在启动。' : '先填下面的路径，或点「自动探测」。'));
  }
  const facts = $('qq-now-facts');
  if (facts) {
    const rows = [
      ['进程数', running ? String(q.count) : '0'],
      ['自动启动', q.autoLaunch === false ? '已关' : '已开'],
      ['路径', q.runningPath || q.path || '未配置']
    ];
    facts.innerHTML = rows.map(function (r) {
      const val = String(r[1]).replace(/</g, '&lt;');
      return '<div><div class="hint" style="margin:0">' + r[0] + '</div>'
        + '<div style="font-weight:600;font-size:13.5px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + val + '">' + val + '</div></div>';
    }).join('');
  }
  if (q.path && !$('qq-path').value) $('qq-path').value = q.path;
  if ($('qq-auto')) $('qq-auto').checked = q.autoLaunch !== false;
}
async function loadQQ() {
  try {
    const s = await api('status');
    applyQQ(s.qq);
    const gw = s.gateway;
    if (gw && $('gw-state')) {
      const st = $('gw-state');
      st.textContent = gw.running ? (gw.pid ? '运行中（PID ' + gw.pid + '）' : '运行中') : (gw.installed ? '未运行' : '没有安装网关');
      st.style.color = gw.running ? 'var(--ok)' : (gw.installed ? 'var(--muted)' : 'var(--warn)');
      $('gw-webui').textContent = gw.webui ? '127.0.0.1:' + gw.webuiPort + ' 在线' : (gw.installed ? '离线' : '—');
      $('gw-onebot').textContent = (gw.onebotHttp && gw.onebotWs) ? '38000 / 38001 在线' : (gw.running ? '离线' : '—');
    }
    // 网关进程起来了但 OneBot 没开：多半是 QQ 没被重新注入，把话说明白
    const gt = $('gw-toast');
    if (gt) {
      if (s.gatewayHint) {
        gt.textContent = s.gatewayHint;
        gt.style.color = 'var(--warn)';
      } else if (gt.style.color) {
        gt.textContent = '';
        gt.style.color = '';
      }
    }
    const hint = $('qq-path-hint');
    if (!hint) return;
    if (s.qq && s.qq.configured) hint.textContent = '已保存：' + s.qq.path;
    else if (s.qq && s.qq.runningPath) hint.textContent = '检测到正在运行的 QQNT：' + s.qq.runningPath + '（点「自动探测」填进去再保存）';
    else if (s.qq && s.qq.legacyRunning) hint.textContent = '只认 QQNT 版 QQ：老版 QQ 开着也不算，请装/开 QQNT 版。';
    else hint.textContent = '还没保存路径；自动探测只认 QQNT 版 QQ，老版（9.7 那批）不会被选。';
  } catch (e) { /* 忽略 */ }
}

// ── 版本与更新 ──────────────────────────────────────────
// 三条线：本程序（GitHub Release）、协议端 SnowLuma（GitHub Release）、本机 QQ 版本。
// 只查不装，下载一律走浏览器，免得面板要处理 30MB+ 的覆盖写入。
const escVer = function (v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

function verRow(label, value, tone, note, links) {
  const badge = tone ? '<span class="badge ' + tone + '">' + escVer(note) + '</span>' : '';
  const list = Array.isArray(links) ? links : links ? [links] : [];
  const actions = list.map(function (l) {
    if (l.act) return '<button class="btn" data-ver-act="' + escVer(l.act) + '">' + escVer(l.text) + '</button>';
    return '<a class="link" href="' + escVer(l.href) + '" target="_blank" rel="noreferrer">' + escVer(l.text) + '</a>';
  }).join('');
  return '<div class="ver-row">'
    + '<div class="ver-k">' + label + '</div>'
    + '<div class="ver-n">' + escVer(value) + '</div>'
    + '<div class="ver-b">' + badge + '</div>'
    + '<div class="ver-a">' + actions + '</div>'
    + '</div>';
}

function renderVersion(v) {
  const body = $('ver-body');
  if (!body) return;
  if (!v || v.ok === false) {
    body.innerHTML = '<div class="hint">检查失败：' + escVer((v && v.error) || '未知错误') + '</div>';
    return;
  }
  const a = v.app || {};
  const s = v.snowluma || {};
  const q = v.qq || {};
  const rows = [
    verRow('本程序', 'v' + (a.version || '?'),
      a.updateAvailable ? 'warn' : a.error ? 'off' : 'on',
      a.updateAvailable ? '有新版 v' + a.latest : a.error ? '查不到最新版' : '已是最新',
      a.updateAvailable ? [{ act: 'app', text: '立即更新' }, { href: a.url, text: '下载页' }] : null),
    verRow('SnowLuma', s.version ? 'v' + s.version : '未安装',
      s.updateAvailable ? 'warn' : s.error ? 'off' : 'on',
      s.updateAvailable ? '有新版 v' + s.latest : s.error ? '查不到最新版' : '已是最新',
      s.updateAvailable ? [{ act: 'gateway', text: '立即更新' }, { href: s.url, text: '下载页' }] : null),
    verRow('本机 QQ', q.version || '没找到',
      q.changed ? 'warn' : null,
      q.changed ? '升级过（上次 ' + q.previous + '）' : '',
      null)
  ];
  body.innerHTML = rows.join('');
}

async function loadVersion(force) {
  const body = $('ver-body');
  if (body) body.innerHTML = '<div class="hint">检查中…</div>';
  try {
    renderVersion(await api('version' + (force ? '?force=1' : '')));
  } catch (e) {
    if (body) body.innerHTML = '<div class="hint">检查失败：' + escVer(e.message) + '</div>';
  }
}

// ── 表情包 ──────────────────────────────────────────────
// GET /api/stickers 只读本地库；POST /api/stickers/sync 才会去 QQ 那边重拉一份。
// 写副作用不挂在读接口上，所以「刷新」和「同步」是两个按钮语义。
async function loadStickers(force) {
  const body = $('stk-body');
  if (!body) return;
  body.innerHTML = '<div class="hint" style="padding:16px">' + (force ? '正在从 QQ 同步…' : '读取中…') + '</div>';
  let r;
  try {
    r = force
      ? await consoleFetch('/api/stickers/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
      : await consoleFetch('/api/stickers?count=200');
  } catch (e) {
    body.innerHTML = '<div class="hint" style="padding:16px">读取失败：' + escVer(e.message) + '</div>';
    return;
  }
  const list = Array.isArray(r.stickers) ? r.stickers : (Array.isArray(r.entries) ? r.entries : []);
  if ($('stk-count')) $('stk-count').textContent = list.length ? '（' + list.length + ' 个）' : '';
  if (!list.length) {
    body.innerHTML = '<div class="hint" style="padding:16px">还没有收藏表情。在 QQ 里收藏几个，再点「从 QQ 重新同步」。</div>';
    return;
  }
  body.innerHTML = '<div class="stk-grid">' + list.map(function (s) {
    const name = escVer(s.desc || s.localNote || String(s.md5 || '').slice(0, 8));
    const used = s.useCount ? '<div class="stk-badge">用过 ' + s.useCount + ' 次</div>' : '';
    return '<div class="stk-item"><img loading="lazy" src="' + escVer(s.url) + '" alt="' + name + '">'
      + '<div class="stk-note">' + name + '</div>' + used + '</div>';
  }).join('') + '</div>';
}
if ($('stk-sync')) $('stk-sync').onclick = function () { void loadStickers(true); };

    if (r.updating) toast('已开始替换，面板会自己重启，等十几秒就好');
    else if (r.already) toast('已经是最新版');

    setTimeout(function () { void loadVersion(true); }, r.updating ? 8000 : 1500);
  } catch (e) {
    toast('更新失败：' + e.message, true);
    btn.disabled = false;
    btn.textContent = label;
  }
});

function notifyWindowClosed() {
  try { navigator.sendBeacon('/panel/api/window-closed'); } catch (e) { /* 忽略 */ }
}
window.addEventListener('pagehide', notifyWindowClosed);
window.addEventListener('beforeunload', notifyWindowClosed);

void loadCloseSetting();
// 支持 /#quiet 这种直接落在某一页的地址；不认识的 hash 就回到启动页。
const initialPage = (location.hash || '').replace('#', '').trim();
if (initialPage && NAV.some(function (g) { return g.items.some(function (it) { return it.id === initialPage; }); })) {
  go(initialPage);
} else {
  go('status');
}

// 第一次打开（或者 key/范围都还没配）先拦到「快速开始」。
// 已经配好的人不该被引导页烦；url 带 hash 的也不拦，用户可能就是要去某一页。
void (async function maybeOnboard() {
  if (initialPage) return;
  try {
    const st = await api('settings');
    if (st.onboarded) return;
    const s = await api('status');
    const scopes = [...(s.config?.groups || []), ...(s.config?.private || [])];
    if (s.config?.hasKey && scopes.length) {
      // 老用户：配置齐了，直接标记走过，以后不再检查。
      await api('settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ onboarded: true }) });
      return;
    }
    go('start');
  } catch { /* 读不到就别拦 */ }
})();
refreshStatus();
loadLogs();
setInterval(refreshStatus, 2500);
setInterval(() => { if (active === 'status') loadLogs(); }, 4000);
